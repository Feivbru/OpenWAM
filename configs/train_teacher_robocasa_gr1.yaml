# OpenWAM FPD teacher pretrain on RoboCasa-GR1 (Alpha-Sim-RoboCasa-GR1 warm-start).
# Mirrors train_teacher_robotwin_clean2random hyperparams; max_steps=5000.
#
# Launch (6x GPU):
#   CUDA_VISIBLE_DEVICES=2,3,4,5,6,7 NPROC=6 CONDA_ENV=openwam_re \
#     bash scripts/train_teacher_robocasa_gr1.sh

defaults:
  - model: dual_system
  - dataloader: robocasa_gr1
  - _self_

training:
  debug: false
  learning_rate: 5.0e-7
  adam_betas: [0.9, 0.95]
  weight_decay: 0.01
  max_grad_norm: 1.0

  num_epochs: null
  max_steps: 5000
  batch_size: 16
  gradient_accumulation_steps: 1

  lr_scheduler: cosine
  warmup_ratio: 0.05
  lr_min_ratio: 0.01
  action_lr: null
  video_lr: null

  mixed_precision: bf16
  zero_stage: 2
  offload_optimizer_device: none

  use_gradient_checkpointing: false
  use_gradient_checkpointing_offload: false
  initialize_model_on_cpu: true

  # Teacher pretrain: clean video + action only (FastWAM VLA-style)
  video_mode: clean
  lambda_video: 0.0
  lambda_action: 1.0
  lambda_distill: 0.0
  use_distill_gate: false

  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0

  output_path: outputs/openwam_teacher_robocasa_gr1
  save_steps: 5000
  save_full_states_for_resume: false
  keep_last_k_ckpts: 1

  finetune_ckpt_path: assets/openwam_ckpt/openwam_alpha/OpenWAM-Alpha-Sim-RoboCasa-GR1
  resume_ckpt_path: null

  dataset_num_workers: 4

# Offline UMT5 embeds (per-bucket meta/umt5_openwam/task_*.pt); skips live T5.
dataloader:
  use_t5_cache: true

model:
  freeze_video_dit: false
  architecture:
    mot_checkpoint_mixed_attn: true
  video_backbone:
    model_path: /data/zixian_guo/projects/haoming/project/Motus/pretrained_models/Wan2.2-TI2V-5B

fpd:
  enabled: false

project:
  name: openwam_teacher_robocasa_gr1
  output_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}_teacher_robocasa_gr1
  seed: 42
  wandb:
    project: openwam
    run_name: teacher_robocasa_gr1
    entity: null
    mode: online
