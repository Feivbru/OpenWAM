# OpenWAM FPD on EBench — release student + frozen teacher.
# Mirrors train_fpd_robotwin_full hyperparams; dataset/ckpt use EBench defaults.
#
# Launch (2x GPU):
#   CUDA_VISIBLE_DEVICES=6,7 NPROC=2 \
#     TEACHER_CKPT=outputs/openwam_teacher_ebench/<run> \
#     bash scripts/train_fpd_ebench.sh

defaults:
  - model: dual_system
  - dataloader: ebench
  - _self_

training:
  debug: false
  learning_rate: 5.0e-7
  adam_betas: [0.9, 0.95]
  weight_decay: 0.01
  max_grad_norm: 1.0

  num_epochs: null
  max_steps: 10000
  batch_size: 8
  gradient_accumulation_steps: 1

  lr_scheduler: cosine
  warmup_ratio: 0.05
  lr_min_ratio: 0.01
  action_lr: null
  video_lr: null

  mixed_precision: bf16
  zero_stage: 2
  offload_optimizer_device: none

  use_gradient_checkpointing: false
  use_gradient_checkpointing_offload: false
  initialize_model_on_cpu: true

  # 3-loss FPD
  lambda_video: 0.01
  lambda_action: 1.0
  lambda_distill: 1.0
  use_distill_gate: true

  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0

  output_path: outputs/openwam_fpd_ebench
  save_steps: 10000
  save_full_states_for_resume: false
  keep_last_k_ckpts: 1

  # Student warm-start from EBench open-source release
  finetune_ckpt_path: assets/openwam_ckpt/openwam_alpha/OpenWAM-Alpha-Sim-EBench
  resume_ckpt_path: null

  dataset_num_workers: 4

model:
  freeze_video_dit: false
  architecture:
    mot_checkpoint_mixed_attn: true
  video_backbone:
    model_path: /data/zixian_guo/projects/haoming/project/Motus/pretrained_models/Wan2.2-TI2V-5B

fpd:
  enabled: true
  # Placeholder; launch script overrides with TEACHER_CKPT or latest teacher run.
  teacher_ckpt_path: outputs/openwam_teacher_ebench/PLACEHOLDER

project:
  name: openwam_fpd_ebench
  output_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}_fpd_ebench
  seed: 42
  wandb:
    project: openwam
    run_name: fpd_ebench
    entity: null
    mode: online
