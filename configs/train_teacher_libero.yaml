# OpenWAM FPD teacher pretrain on LIBERO (Alpha-Sim-LIBERO warm-start).
# Mirrors train_teacher_robotwin_full: GT video at clean σ≈0 endpoint, action FM only.
# Default train mask (mutual + first_frame_causal); no VLA mask switch.
#
# After this run, point FPD's fpd.teacher_ckpt_path at this output dir.
#
# Launch (2x GPU):
#   CUDA_VISIBLE_DEVICES=2,3 bash scripts/train_teacher_libero.sh

defaults:
  - model: dual_system
  - dataloader: libero
  - _self_

training:
  debug: false
  learning_rate: 5.0e-7
  adam_betas: [0.9, 0.95]
  weight_decay: 0.01
  max_grad_norm: 1.0

  num_epochs: null
  max_steps: 3500
  batch_size: 16
  gradient_accumulation_steps: 1

  lr_scheduler: cosine
  warmup_ratio: 0.05
  lr_min_ratio: 0.01
  action_lr: null
  video_lr: null

  mixed_precision: bf16
  zero_stage: 2
  offload_optimizer_device: none

  use_gradient_checkpointing: false
  use_gradient_checkpointing_offload: false
  initialize_model_on_cpu: true

  # Teacher pretrain: clean video + action only (FastWAM VLA-style)
  video_mode: clean
  lambda_video: 0.0
  lambda_action: 1.0
  lambda_distill: 0.0
  use_distill_gate: false

  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0

  output_path: outputs/openwam_teacher_libero
  save_steps: 5000
  save_full_states_for_resume: false
  keep_last_k_ckpts: 1

  finetune_ckpt_path: assets/openwam_ckpt/openwam_alpha/OpenWAM-Alpha-Sim-LIBERO
  resume_ckpt_path: null

  dataset_num_workers: 4

dataloader:
  use_t5_cache: true

model:
  # Unfreezing video DiT under ZeRO-2+bf16 NaNs after the first optimizer step on
  # LIBERO (param poison). Freeze video DiT; action expert still trains (same
  # workable pattern as C2R RoboTwin teacher). Revisit when root-caused.
  freeze_video_dit: false
  architecture:
    mot_checkpoint_mixed_attn: true
  video_backbone:
    model_path: /data/zixian_guo/projects/haoming/project/Motus/pretrained_models/Wan2.2-TI2V-5B

fpd:
  enabled: false

project:
  name: openwam_teacher_libero
  output_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}_teacher_libero
  seed: 42
  wandb:
    project: openwam
    run_name: teacher_libero
    entity: null
    mode: online
