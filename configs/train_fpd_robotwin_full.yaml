# OpenWAM FPD on RoboTwin — Full warm-start student + frozen teacher.
# Real experiments: train teacher first (train_teacher_robotwin_full), then set
# fpd.teacher_ckpt_path to that run dir. Open-source Full path is for smoke only.
#
# Launch (2x GPU):
#   CUDA_VISIBLE_DEVICES=6,7 torchrun --nproc_per_node=2 scripts/train.py \
#     --config-name=train_fpd_robotwin_full

defaults:
  - model: dual_system
  - dataloader: robotwin
  - _self_

training:
  debug: false
  learning_rate: 5.0e-7
  adam_betas: [0.9, 0.95]
  weight_decay: 0.01
  max_grad_norm: 1.0

  num_epochs: null
  max_steps: 10000
  batch_size: 8
  gradient_accumulation_steps: 1

  lr_scheduler: cosine
  warmup_ratio: 0.05
  lr_min_ratio: 0.01
  action_lr: null
  video_lr: null

  mixed_precision: bf16
  zero_stage: 2
  offload_optimizer_device: none

  use_gradient_checkpointing: false
  use_gradient_checkpointing_offload: false
  initialize_model_on_cpu: true
  # FPD keeps a full frozen teacher DiT on each GPU; offload Adam states to CPU
  # so per-GPU batch_size=1 fits on H20 96G (OOM was at optimizer.step).

  # 3-loss FPD
  lambda_video: 0.01
  lambda_action: 1.0
  lambda_distill: 1.0
  use_distill_gate: true

  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0

  output_path: outputs/openwam_fpd_robotwin_full
  save_steps: 10000
  save_full_states_for_resume: false
  keep_last_k_ckpts: 1

  # Student warm-start from Full open-source release
  finetune_ckpt_path: assets/openwam_ckpt/openwam_alpha/OpenWAM-Alpha-Sim-RoboTwin-Full
  resume_ckpt_path: null

  dataset_num_workers: 4

dataloader:
  use_t5_cache: true

model:
  # Same as teacher: freeze student video DiT to keep ZeRO-2 FP32 grad flatten small
  # (FPD already keeps a full frozen teacher DiT on GPU).
  freeze_video_dit: false
  architecture:
    mot_checkpoint_mixed_attn: true
  video_backbone:
    model_path: /data/zixian_guo/projects/haoming/project/Motus/pretrained_models/Wan2.2-TI2V-5B

fpd:
  enabled: true
  # Trained teacher from train_teacher_robotwin_full (40k steps).
  teacher_ckpt_path: outputs/openwam_teacher_robotwin_full/2026-09-24_17-41-21

project:
  name: openwam_fpd_robotwin_full
  output_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}_fpd_full
  seed: 42
  wandb:
    project: openwam
    run_name: fpd_robotwin_full
    entity: null
    mode: online
