# OpenWAM-α Foundation finetune on banana Piper (real single-arm, EEF10 via FK).
#
# - Dataloader: banana_piper (LeRobot v2.1 + derived/eef sidecar)
# - Text: offline UMT5 cache (single instruction) → skip loading T5 weights
# - Launch: bash scripts/train_banana_piper.sh
#
# Hyperparams target a small real-robot corpus (~45 train episodes / ~24k
# windows): lower LR than scratch, modest per-GPU batch, more epochs, color
# jitter on, joint video+action WAM loss.

defaults:
  - model: dual_system
  - dataloader: banana_piper
  - _self_

training:
  debug: false

  # Small real-robot finetune from Foundation: 1e-4 is too hot; 5e-7 is for
  # same-domain teacher continuation. 1e-5 is a stable middle ground.
  learning_rate: 1.0e-5
  adam_betas: [0.9, 0.95]
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Match riri banana sample volume (~160k): 7 epochs × ~24k windows.
  # 6 GPU × bs8 → global 48 → ~3.5k steps (~riri 10k×16).
  num_epochs: 7
  max_steps: null
  batch_size: 8
  gradient_accumulation_steps: 1

  lr_scheduler: cosine
  warmup_ratio: 0.05
  lr_min_ratio: 0.01
  action_lr: null
  video_lr: null

  mixed_precision: bf16
  zero_stage: 2
  offload_optimizer_device: none

  use_gradient_checkpointing: false
  use_gradient_checkpointing_offload: false
  initialize_model_on_cpu: true

  # Full WAM objective (not teacher-only clean/action).
  video_mode: train
  lambda_video: 1.0
  lambda_action: 1.0
  lambda_distill: 0.0
  use_distill_gate: false

  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0

  output_path: outputs/banana_piper_ft
  save_steps: 2000
  save_full_states_for_resume: false
  keep_last_k_ckpts: 3

  finetune_ckpt_path: assets/openwam_ckpt/openwam_alpha/OpenWAM-Alpha-Pretrain-Foundation-Model
  resume_ckpt_path: null

  dataset_num_workers: 4

dataloader:
  use_t5_cache: true
  t5_cache_dirname: umt5_openwam
  color_jitter:
    enabled: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.0

model:
  # Unfrozen video DiT is stable when PYTORCH_CUDA_ALLOC_CONF is unset
  # (expandable_segments:True was correlated with step-1 NaN on this stack).
  freeze_video_dit: false
  architecture:
    mot_checkpoint_mixed_attn: true
  video_backbone:
    model_path: /data/zixian_guo/projects/haoming/project/Motus/pretrained_models/Wan2.2-TI2V-5B

fpd:
  enabled: false

project:
  name: banana_piper_ft
  output_dir: outputs/banana_piper_ft_${now:%Y%m%d_%H%M%S}
  seed: 42
  wandb:
    project: openwam
    run_name: banana_piper_ft
    entity: null
    mode: online
