# OpenWAM FPD on RoboTwin — Clean2Random open-source warm-start.
# Same as train_fpd_robotwin_full.yaml except ckpt paths.

defaults:
  - model: dual_system
  - dataloader: robotwin
  - _self_

training:
  debug: false
  learning_rate: 5.0e-7
  adam_betas: [0.9, 0.95]
  weight_decay: 0.01
  max_grad_norm: 1.0

  num_epochs: null
  max_steps: 10000
  batch_size: 4
  gradient_accumulation_steps: 1

  lr_scheduler: cosine
  warmup_ratio: 0.05
  lr_min_ratio: 0.01
  action_lr: null
  video_lr: null

  mixed_precision: bf16
  zero_stage: 2

  use_gradient_checkpointing: true
  use_gradient_checkpointing_offload: false
  initialize_model_on_cpu: true
  offload_optimizer_device: none

  lambda_video: 0.01
  lambda_action: 1.0
  lambda_distill: 1.0
  use_distill_gate: true

  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0

  output_path: outputs/openwam_fpd_robotwin_clean2random
  save_steps: 2000
  save_full_states_for_resume: false
  keep_last_k_ckpts: 1

  finetune_ckpt_path: assets/openwam_ckpt/openwam_alpha/OpenWAM-Alpha-Sim-RoboTwin-Clean2Random
  resume_ckpt_path: null

  dataset_num_workers: 4

dataloader:
  use_t5_cache: true

model:
  freeze_video_dit: true
  video_backbone:
    model_path: /data/zixian_guo/projects/haoming/project/Motus/pretrained_models/Wan2.2-TI2V-5B

fpd:
  enabled: true
  # Override via TEACHER_CKPT / script; placeholder until a c2r teacher exists.
  teacher_ckpt_path: assets/openwam_ckpt/openwam_alpha/OpenWAM-Alpha-Sim-RoboTwin-Clean2Random

project:
  name: openwam_fpd_robotwin_clean2random
  output_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}_fpd_c2r
  seed: 42
  wandb:
    project: openwam
    run_name: fpd_robotwin_clean2random
    entity: null
    mode: online
