# OpenWAM FPD on RoboTwin — Clean2Random warm-start student + frozen teacher.
# Same hyperparams as train_fpd_robotwin_full.yaml; only ckpt / names differ.
#
# Launch (2x GPU):
#   CUDA_VISIBLE_DEVICES=6,7 VARIANT=c2r NPROC=2 CONDA_ENV=openwam_re \
#     TEACHER_CKPT=outputs/openwam_teacher_robotwin_clean2random/2026-10-02_21-29-18 \
#     bash scripts/train_fpd_robotwin.sh

defaults:
  - model: dual_system
  - dataloader: robotwin
  - _self_

training:
  debug: false
  learning_rate: 5.0e-7
  adam_betas: [0.9, 0.95]
  weight_decay: 0.01
  max_grad_norm: 1.0

  num_epochs: null
  max_steps: 10000
  batch_size: 8
  gradient_accumulation_steps: 1

  lr_scheduler: cosine
  warmup_ratio: 0.05
  lr_min_ratio: 0.01
  action_lr: null
  video_lr: null

  mixed_precision: bf16
  zero_stage: 2
  offload_optimizer_device: none

  use_gradient_checkpointing: false
  use_gradient_checkpointing_offload: false
  initialize_model_on_cpu: true
  # FPD keeps a full frozen teacher DiT on each GPU; offload Adam states to CPU
  # so per-GPU batch_size=1 fits on H20 96G (OOM was at optimizer.step).

  # 3-loss FPD
  lambda_video: 0.01
  lambda_action: 1.0
  lambda_distill: 1.0
  use_distill_gate: true

  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0

  output_path: outputs/openwam_fpd_robotwin_clean2random
  save_steps: 10000
  save_full_states_for_resume: false
  keep_last_k_ckpts: 1

  # Student warm-start from Clean2Random open-source release
  finetune_ckpt_path: assets/openwam_ckpt/openwam_alpha/OpenWAM-Alpha-Sim-RoboTwin-Clean2Random
  resume_ckpt_path: null

  dataset_num_workers: 4

dataloader:
  use_t5_cache: true

model:
  # Same as Full FPD: train student video DiT + action.
  freeze_video_dit: false
  architecture:
    mot_checkpoint_mixed_attn: true
  video_backbone:
    model_path: /data/zixian_guo/projects/haoming/project/Motus/pretrained_models/Wan2.2-TI2V-5B

fpd:
  enabled: true
  # Trained C2R teacher (override via TEACHER_CKPT / script).
  teacher_ckpt_path: outputs/openwam_teacher_robotwin_clean2random/2026-10-02_21-29-18

project:
  name: openwam_fpd_robotwin_clean2random
  output_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}_fpd_c2r
  seed: 42
  wandb:
    project: openwam
    run_name: fpd_robotwin_clean2random
    entity: null
    mode: online
